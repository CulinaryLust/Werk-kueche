name: Bauen und veröffentlichen

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Täglich 05:00 UTC: geplante Artikel (Datum erreicht) gehen automatisch online
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check

      - name: Auf ALL-INKL hochladen (FTPS)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          fehlt=""
          [ -z "$FTP_SERVER" ] && fehlt="$fehlt FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && fehlt="$fehlt FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && fehlt="$fehlt FTP_PASSWORD"
          if [ -n "$fehlt" ]; then
            echo "::warning::Repository-Secrets fehlen:$fehlt. Deploy übersprungen."
            echo "UEBERSPRINGEN=1" >> "$GITHUB_ENV"
          fi
      # lftp statt FTP-Deploy-Action: ALL-INKL verlangt TLS-Session-Reuse auf dem Datenkanal
      - name: Hochladen mit lftp
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.UEBERSPRINGEN != '1'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" <<'LFTP'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 30
          # Bilder ändern sich nicht: nur fehlende/größengeänderte hochladen
          mirror -R --ignore-time --parallel=4 --verbose=1 _site/wp-content/ wp-content/
          mirror -R --ignore-time --delete --parallel=4 --verbose=1 _site/bilder/ bilder/
          # Alles andere komplett abgleichen, entfernte Seiten löschen
          mirror -R --delete --parallel=4 --verbose=1 --exclude-glob wp-content/ --exclude-glob bilder/ _site/ ./
          quit
          LFTP
